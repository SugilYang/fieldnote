name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unsplash 사진 삽입
        env:
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
        run: node scripts/add-photos.js
      - name: 방문자 통계 (GA)
        env:
          GA_SERVICE_ACCOUNT: ${{ secrets.GA_SERVICE_ACCOUNT }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
        run: node scripts/fetch-stats.js
      - name: 정적 페이지·색인·피드 생성
        run: node scripts/build.js
      - name: 변경 내용 커밋
        run: |
          git config user.name "fieldnote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts naver posts.json stats.json search.json sitemap.xml sitemap-posts.xml sitemap-pages.xml feed.xml robots.txt index.html license.html safety.html case.html tools.html trend.html life.html
          if ! git diff --cached --quiet; then
            git commit -m "사진·통계·색인 갱신 [skip ci]"
            # 같은 시각에 다른 커밋이 들어와 충돌하면 푸시는 건너뛰고 배포는 계속한다 (다음 배포 때 다시 생성됨)
            git pull --rebase origin main || git rebase --abort
            git push || echo "푸시 건너뜀 (다음 배포 때 반영)"
          fi
      - name: IndexNow 통보
        run: node scripts/indexnow.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub 쪽 일시 오류(아티팩트 조회 실패)가 가끔 있어 1분 뒤 한 번 더 시도한다
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
