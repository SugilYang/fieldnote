name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unsplash 사진 삽입
        env:
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
        run: node scripts/add-photos.js
      - name: 방문자 통계 (GA)
        env:
          GA_SERVICE_ACCOUNT: ${{ secrets.GA_SERVICE_ACCOUNT }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID }}
        run: node scripts/fetch-stats.js
      - name: 정적 페이지·색인·피드 생성
        run: node scripts/build.js
      - name: 변경 내용 커밋
        run: |
          git config user.name "fieldnote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts posts.json stats.json search.json sitemap.xml feed.xml robots.txt index.html license.html safety.html case.html tools.html trend.html life.html
          if ! git diff --cached --quiet; then git commit -m "사진·통계·색인 갱신 [skip ci]" && git push; fi
      - name: IndexNow 통보
        run: node scripts/indexnow.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
