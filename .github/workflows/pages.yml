name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unsplash 사진 삽입
        env:
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
        run: node scripts/add-photos.js
      - name: 사진 채운 글 커밋
        run: |
          git config user.name "fieldnote-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts posts.json
          if ! git diff --cached --quiet; then git commit -m "사진 삽입 [skip ci]" && git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
